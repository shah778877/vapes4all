<button onclick="addToBasket('unit')" style="background: #ff9500; border:none; padding:1rem 2rem; border-radius:10px; color:white; font-weight:bold; font-size:1.1rem; cursor:pointer; width:100%;">
    🛒 Add to Basket
</button>

<script>
function addToBasket(type, flavour=null) {
  let cart = localStorage.getItem('vapes4all_cart');
  cart = cart ? JSON.parse(cart) : { units:0, pods:[] };
  
  if (type === 'unit') {
    cart.units++;
  } else if (type === 'pod' && flavour) {
    const existing = cart.pods.find(p => p.flavour === flavour);
    if (existing) existing.qty++;
    else cart.pods.push({ flavour, qty:1 });
  }
  
  localStorage.setItem('vapes4all_cart', JSON.stringify(cart));
  alert('✅ Added to basket!');
}
</script>
