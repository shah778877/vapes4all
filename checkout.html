<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basket — Vapes4All</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#f8f9fb;
color:#222;
}
/* Top Banner */
.top-banner{
background:linear-gradient(90deg, #ff9500, #ffb347);
color:white;
text-align:center;
padding:10px 20px;
font-weight:bold;
font-size:15px;
}
/* Header & Nav */
header{
background:white;
box-shadow:0 2px 8px rgba(0,0,0,.06);
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}
.site-title{
font-size:22px;
font-weight:bold;
color:#ff9500;
text-decoration:none;
}
.nav-links a{
color:#333;
text-decoration:none;
margin-left:15px;
font-weight:bold;
font-size:15px;
}
.nav-links a:hover, .nav-links a.active{
color:#ff9500;
}
/* Main Container */
.container{
max-width:900px;
margin:40px auto;
padding:0 25px;
}
h1{
font-size:30px;
margin-bottom:30px;
color:#222;
}
/* Basket Items */
.basket-section{
background:white;
border-radius:12px;
padding:30px;
box-shadow:0 3px 10px rgba(0,0,0,.06);
margin-bottom:25px;
}
.basket-empty{
text-align:center;
padding:40px;
color:#888;
font-size:17px;
}
.basket-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 0;
border-bottom:1px solid #eee;
}
.basket-item:last-child{
border-bottom:none;
}
.item-name{
font-weight:bold;
font-size:15px;
}
.item-details{
display:flex;
gap:20px;
align-items:center;
}
.item-qty{
font-size:14px;
color:#666;
}
.item-price{
font-weight:bold;
color:#ff9500;
font-size:16px;
}
.remove-btn{
background:#ff4d4d;
color:white;
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
font-size:13px;
font-weight:bold;
}
.remove-btn:hover{
background:#e63939;
}
/* Deal Notice */
.deal-notice{
background:#f0fff4;
border:1px solid:#22c55e;
border-radius:8px;
padding:15px;
margin:20px 0;
color:#166534;
font-weight:bold;
display:none;
}
/* Totals */
.totals-row{
display:flex;
justify-content:space-between;
padding:12px 0;
font-size:16px;
}
.totals-row.total{
font-size:20px;
font-weight:bold;
border-top:2px solid #eee;
padding-top:20px;
margin-top:10px;
}
.free-dpd-note{
color:#22c55e;
font-size:14px;
margin-top:10px;
}
/* Buttons */
.btn-group{
display:flex;
gap:15px;
margin-top:30px;
flex-wrap:wrap;
}
.clear-btn{
background:#eee;
color:#333;
border:none;
padding:14px 25px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
font-size:15px;
}
.clear-btn:hover{
background:#ddd;
}
.checkout-btn{
background:#ff9500;
color:white;
border:none;
padding:14px 35px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
font-size:15px;
flex:1;
}
.checkout-btn:hover{
background:#e68600;
}
/* Form Section */
.form-section{
background:white;
border-radius:12px;
padding:30px;
box-shadow:0 3px 10px rgba(0,0,0,.06);
display:none;
}
.form-section h2{
font-size:22px;
margin-bottom:20px;
color:#ff9500;
}
.form-group{
margin-bottom:18px;
}
.form-group label{
display:block;
margin-bottom:6px;
font-weight:bold;
color:#333;
font-size:14px;
}
.form-group input, .form-group textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
background:#fafafa;
}
.form-group input:focus, .form-group textarea:focus{
outline:none;
border-color:#ff9500;
}
.submit-payment-btn{
background:#22c55e;
color:white;
border:none;
padding:14px 35px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
font-size:16px;
width:100%;
margin-top:10px;
}
.submit-payment-btn:hover{
background:#16a34a;
}
/* Mobile */
@media(max-width:768px){
.basket-item{flex-direction:column; align-items:flex-start; gap:10px;}
.item-details{width:100%; justify-content:space-between;}
.btn-group{flex-direction:column;}
}
</style>
</head>
<body>

<!-- Top Banner -->
<div class="top-banner">
🚚 FREE DPD TRACKED DELIVERY ON ORDERS £23+
</div>

<!-- Header -->
<header>
<a href="index.html" class="site-title">Vapes4All</a>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="dojo-units.html">10K Units</a>
<a href="dojo-pods.html">10K Pods</a>
<a href="ivg.html">IVG 10K</a>
<a href="checkout.html" class="active" style="color:#ff9500">Basket</a>
<a href="contact.html">Contact</a>
</div>
</header>

<!-- Main Basket -->
<div class="container">
<h1>Your Basket 🛒</h1>

<div class="basket-section" id="basketContainer">
<div class="basket-empty" id="emptyMsg">Your basket is empty — go add some items!</div>
<div id="itemsList"></div>

<div class="deal-notice" id="dealNotice">
✅ Deal Applied!
</div>

<div id="totalsArea" style="display:none;">
<div class="totals-row">
<span>Subtotal</span>
<span id="subtotal">£0.00</span>
</div>
<div class="totals-row">
<span>DPD Tracked Delivery</span>
<span id="delivery">£2.99</span>
</div>
<div class="free-dpd-note" id="freeNote" style="display:none;">✅ Delivery FREE — order £23+!</div>
<div class="totals-row total">
<span>Total</span>
<span id="total">£0.00</span>
</div>
</div>

<div class="btn-group" id="btnGroup" style="display:none;">
<button class="clear-btn" onclick="clearBasket()">Clear Basket</button>
<button class="checkout-btn" onclick="showCheckout()">Proceed To Checkout →</button>
</div>
</div>

<!-- Checkout Form -->
<div class="form-section" id="checkoutForm">
<h2>Delivery & Payment Details</h2>
<form onsubmit="submitOrder(event)">
<div class="form-group">
<label>Full Name</label>
<input type="text" id="fullName" required placeholder="Your full name">
</div>
<div class="form-group">
<label>Email Address</label>
<input type="email" id="emailAddr" required placeholder="your@email.com">
</div>
<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="phoneNum" required placeholder="Your mobile number">
</div>
<div class="form-group">
<label>Full Delivery Address</label>
<textarea id="address" rows="3" required placeholder="House number, street, town, postcode"></textarea>
</div>
<button type="submit" class="submit-payment-btn">Pay Now →</button>
</form>
</div>

</div>

<script>
let basket = JSON.parse(localStorage.getItem('vapes4all_basket') || '[]');
const dojoUnitsDeal = { min:3, dealPrice:12.99, normalPrice:6.99, nameMatch:'Dojo Blast 10K Unit' };
const dojoPodsDeal = { min:6, dealPrice:20.00, normalPrice:4.99, nameMatch:'Dojo Pods' };

function renderBasket(){
const itemsList = document.getElementById('itemsList');
const emptyMsg = document.getElementById('emptyMsg');
const totalsArea = document.getElementById('totalsArea');
const btnGroup = document.getElementById('btnGroup');
const dealNotice = document.getElementById('dealNotice');

if(basket.length === 0){
emptyMsg.style.display = 'block';
itemsList.innerHTML = '';
totalsArea.style.display = 'none';
btnGroup.style.display = 'none';
dealNotice.style.display = 'none';
document.getElementById('checkoutForm').style.display = 'none';
return;
}

emptyMsg.style.display = 'none';
totalsArea.style.display = 'block';
btnGroup.style.display = 'flex';

itemsList.innerHTML = '';
let subtotal = 0;
let unitsCount = 0;
let podsCount = 0;

basket.forEach((item, idx) => {
if(item.name.includes('Dojo Blast 10K Unit')) unitsCount += item.qty;
if(item.name.includes('Dojo Pods')) podsCount += item.qty;

subtotal += item.price * item.qty;

itemsList.innerHTML += `
<div class="basket-item">
<div>
<div class="item-name">${item.name}</div>
<div class="item-qty">Qty: ${item.qty}</div>
</div>
<div class="item-details">
<div class="item-price">£${(item.price * item.qty).toFixed(2)}</div>
<button class="remove-btn" onclick="removeItem(${idx})">Remove</button>
</div>
</div>
`;
});

// Apply deals
let dealText = '';
if(unitsCount >= dojoUnitsDeal.min){
const covered = Math.floor(unitsCount / dojoUnitsDeal.min);
const remainder = unitsCount % dojoUnitsDeal.min;
subtotal = covered * dojoUnitsDeal.dealPrice + remainder * dojoUnitsDeal.normalPrice;
dealText += `✅ ${unitsCount} Dojo Units → £${dojoUnitsDeal.dealPrice} per 3 applied! `;
}
if(podsCount >= dojoPodsDeal.min){
const covered = Math.floor(podsCount / dojoPodsDeal.min);
const remainder = podsCount % dojoPodsDeal.min;
subtotal = covered * dojoPodsDeal.dealPrice + remainder * dojoPodsDeal.normalPrice;
dealText += `✅ ${podsCount} Dojo Pods → £${dojoPodsDeal.dealPrice} per 6 applied!`;
}

dealNotice.style.display = dealText ? 'block' : 'none';
dealNotice.textContent = dealText;

// Delivery
let delivery = subtotal >= 23 ? 0 : 2.99;
document.getElementById('freeNote').style.display = subtotal >= 23 ? 'block' : 'none';
document.getElementById('delivery').textContent = delivery === 0 ? 'FREE' : '£2.99';

document.getElementById('subtotal').textContent = `£${subtotal.toFixed(2)}`;
document.getElementById('total').textContent = `£${(subtotal + delivery).toFixed(2)}`;
}

function removeItem(idx){
basket.splice(idx, 1);
localStorage.setItem('vapes4all_basket', JSON.stringify(basket));
renderBasket();
}

function clearBasket(){
if(confirm('Clear your entire basket?')){
basket = [];
localStorage.setItem('vapes4all_basket', JSON.stringify(basket));
renderBasket();
}
}

function showCheckout(){
document.getElementById('checkoutForm').style.display = 'block';
document.getElementById('checkoutForm').scrollIntoView({behavior:'smooth'});
}

function submitOrder(e){
e.preventDefault();
alert('✅ Order submitted! We will contact you to arrange payment & delivery. Thank you!');
basket = [];
localStorage.setItem('vapes4all_basket', JSON.stringify(basket));
renderBasket();
document.getElementById('checkoutForm').style.display = 'none';
}

renderBasket();
</script>

</body>
</html>
