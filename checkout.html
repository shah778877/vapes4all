<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Basket — Vapes4All</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --bg: #050510;
            --card: #12122b;
            --accent: #ff9500;
            --green: #22c55e;
            --red: #ef4444;
            --text: #ffffff;
            --muted: #94a3b8;
        }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 3rem; }
        header { background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); padding: 1rem 5%; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .nav-wrap { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--accent); text-decoration: none; }
        nav a { color: var(--text); text-decoration: none; margin-left: 1.5rem; font-weight: 500; transition: 0.2s; }
        nav a:hover, nav a.active { color: var(--accent); }
        .banner { background: linear-gradient(90deg, var(--green), #16a34a); color: white; text-align: center; padding: 0.8rem; font-weight: 700; font-size: 1rem; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 5%; }
        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--accent); }
        .cart-item { background: var(--card); border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .item-info h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
        .item-info p { color: var(--muted); font-size: 0.9rem; }
        .item-controls { display: flex; align-items: center; gap: 0.8rem; }
        .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .qty-btn:hover { transform: scale(1.1); }
        .qty { min-width: 24px; text-align: center; font-weight: bold; }
        .remove-btn { background: var(--red); border: none; padding: 0.5rem 1rem; border-radius: 8px; color: white; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .remove-btn:hover { background: #dc2626; }
        .summary { background: var(--card); border-radius: 16px; padding: 2rem; margin-top: 2rem; border: 1px solid rgba(255,255,255,0.08); }
        .summary-row { display: flex; justify-content: space-between; padding: 0.6rem 0; font-size: 1.05rem; }
        .summary-row.total { font-size: 1.4rem; font-weight: 900; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 0.5rem; padding-top: 1rem; color: var(--accent); }
        .summary-row.free { color: var(--green); font-weight: 700; }
        .need-more { color: #facc15; font-size: 0.9rem; margin-top: 0.5rem; }
        .deal-badge { background: rgba(34,197,94,0.15); border: 1px solid var(--green); border-radius: 8px; padding: 0.4rem 0.8rem; font-size: 0.85rem; color: var(--green); font-weight: 600; margin-left: 0.5rem; }
        .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
        .empty h2 { margin-bottom: 1rem; color: var(--text); }
        .checkout-btn { width: 100%; background: linear-gradient(90deg, var(--accent), #e68400); border: none; padding: 1.2rem; border-radius: 12px; color: white; font-size: 1.2rem; font-weight: 900; cursor: pointer; margin-top: 2rem; transition: 0.3s; }
        .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,149,0,0.3); }
        .checkout-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .clear-btn { background: transparent; border: 1px solid var(--muted); color: var(--muted); padding: 0.7rem 1.5rem; border-radius: 8px; cursor: pointer; margin-top: 1rem; font-weight: 600; transition: 0.2s; }
        .clear-btn:hover { border-color: var(--red); color: var(--red); }
        #payment-form { margin-top: 2rem; display: none; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input { width: 100%; padding: 0.9rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; font-size: 1rem; }
        input:focus { outline: none; border-color: var(--accent); }
        .card-element { padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
        .status { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
        .status.success { background: rgba(34,197,94,0.15); border: 1px solid var(--green); color: var(--green); }
        .status.error { background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: var(--red); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="nav-wrap">
        <a href="index.html" class="logo">Vapes4All</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="dojo-units.html">10K Units</a>
            <a href="dojo-pods.html">10K Pods</a>
            <a href="checkout.html" class="active">Basket</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<div class="banner">
    🚚 FREE DELIVERY ON ALL ORDERS OVER £23 — NATIONWIDE 🚚
</div>

<div class="container">
    <h1>🛒 Your Basket</h1>

    <div id="empty-msg" class="empty">
        <h2>Your basket is empty</h2>
        <p>Add some products to get started!</p>
        <br>
        <a href="dojo-units.html" style="color: var(--accent); font-weight: bold;">→ Shop 10K Units</a><br><br>
        <a href="dojo-pods.html" style="color: var(--accent); font-weight: bold;">→ Shop 10K Pods</a>
    </div>

    <div id="cart-items" style="display: none;"></div>

    <div id="summary" class="summary" style="display: none;">
        <div id="summary-rows"></div>
        <button id="proceed-btn" class="checkout-btn">PROCEED TO PAYMENT</button>
        <button id="clear-btn" class="clear-btn">Clear Basket</button>

        <form id="payment-form">
            <h3 style="margin: 1.5rem 0 1rem;">Delivery Details</h3>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Your full name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Your email">
            </div>
            <div class="form-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" required placeholder="Street address">
            </div>
            <div class="form-group">
                <label for="postcode">Postcode</label>
                <input type="text" id="postcode" required placeholder="e.g. M1 1AA">
            </div>

            <h3 style="margin: 2rem 0 1rem;">Card Payment</h3>
            <div class="form-group">
                <div id="card-element" class="card-element"></div>
            </div>

            <button id="submit-btn" class="checkout-btn" style="margin-top: 1rem;">
                <span id="btn-text">Pay Now</span>
                <span id="btn-loading" style="display: none;">Processing...</span>
            </button>

            <div id="payment-status" class="status"></div>
        </form>
    </div>
</div>

<script>
const stripe = Stripe('pk_live_51UItZoFJdqaVBhtaeXjI9HTTkFIStttRqqoJqmnzD4ZVixfspc7EdlR3Q3vTCdgVCyORwfSyKfgro9sp9PfUHZRk00WOBKSQOG');

const FREE_DELIVERY_THRESHOLD = 23.00;
const DELIVERY_CHARGE = 3.99;
const UNIT_PRICE = 6.99;
const POD_PRICE = 4.99;

function getCart() {
    const cart = localStorage.getItem('vapes4all_cart');
    return cart ? JSON.parse(cart) : { units: 0, pods: [] };
}

function saveCart(cart) {
    localStorage.setItem('vapes4all_cart', JSON.stringify(cart));
    renderCart();
}

function addItem(type, flavour = null) {
    const cart = getCart();
    if (type === 'unit') cart.units++;
    else if (type === 'pod' && flavour) {
        const existing = cart.pods.find(p => p.flavour === flavour);
        if (existing) existing.qty++;
        else cart.pods.push({ flavour, qty: 1 });
    }
    saveCart(cart);
}

function removeItem(type, flavour = null) {
    const cart = getCart();
    if (type === 'unit') cart.units = Math.max(0, cart.units - 1);
    else if (type === 'pod' && flavour) {
        const idx = cart.pods.findIndex(p => p.flavour === flavour);
        if (idx !== -1) {
            cart.pods[idx].qty--;
            if (cart.pods[idx].qty <= 0) cart.pods.splice(idx, 1);
        }
    }
    saveCart(cart);
}

function clearCart() {
    localStorage.removeItem('vapes4all_cart');
    renderCart();
}

function calculateDeals(cart) {
    const units = cart.units;
    const podCount = cart.pods.reduce((sum, p) => sum + p.qty, 0);
    
    const unitFullPrice = units * UNIT_PRICE;
    const unitDeals = Math.floor(units / 3);
    const unitRemainder = units % 3;
    const unitDealPrice = unitDeals * 12 + unitRemainder * UNIT_PRICE;
    const unitSaving = unitFullPrice - unitDealPrice;

    const podFullPrice = podCount * POD_PRICE;
    const podDeals = Math.floor(podCount / 7);
    const podRemainder = podCount % 7;
    const podDealPrice = podDeals * 20 + podRemainder * POD_PRICE;
    const podSaving = podFullPrice - podDealPrice;

    const subtotal = unitDealPrice + podDealPrice;
    const delivery = subtotal >= FREE_DELIVERY_THRESHOLD ? 0 : DELIVERY_CHARGE;
    const total = subtotal + delivery;
    const neededForFree = subtotal < FREE_DELIVERY_THRESHOLD 
        ? (FREE_DELIVERY_THRESHOLD - subtotal).toFixed(2) 
        : 0;

    return { units, podCount, unitSaving, podSaving, subtotal, delivery, total, neededForFree };
}

function renderCart() {
    const cart = getCart();
    const itemsDiv = document.getElementById('cart-items');
    const summaryDiv = document.getElementById('summary');
    const emptyMsg = document.getElementById('empty-msg');

    const hasItems = cart.units > 0 || cart.pods.length > 0;
    
    emptyMsg.style.display = hasItems ? 'none' : 'block';
    itemsDiv.style.display = hasItems ? 'block' : 'none';
    summaryDiv.style.display = hasItems ? 'block' : 'none';

    if (!hasItems) return;

    itemsDiv.innerHTML = '';
    
    if (cart.units > 0) {
        itemsDiv.innerHTML += `
        <div class="cart-item">
            <div class="item-info">
                <h3>DOJO BLAST 10K Unit</h3>
                <p>£${UNIT_PRICE} each ${Math.floor(cart.units/3) > 0 ? `<span class="deal-badge">${Math.floor(cart.units/3)} × 3 for £12 deal applied</span>` : ''}</p>
            </div>
            <div class="item-controls">
                <button class="qty-btn" onclick="removeItem('unit')">−</button>
                <span class="qty">${cart.units}</span>
                <button class="qty-btn" onclick="addItem('unit')">+</button>
                <button class="remove-btn" onclick="cart.units=0;saveCart(cart)">Remove</button>
            </div>
        </div>`;
    }

    cart.pods.forEach(pod => {
        itemsDiv.innerHTML += `
        <div class="cart-item">
            <div class="item-info">
                <h3>${pod.flavour} <span style="color:var(--muted); font-size:0.9rem;">Pod</span></h3>
                <p>£${POD_PRICE} each</p>
            </div>
            <div class="item-controls">
                <button class="qty-btn" onclick="removeItem('pod','${pod.flavour}')">−</button>
                <span class="qty">${pod.qty}</span>
                <button class="qty-btn" onclick="addItem('pod','${pod.flavour}')">+</button>
                <button class="remove-btn" onclick="cart.pods=cart.pods.filter(p=>p.flavour!=='${pod.flavour}');saveCart(cart)">Remove</button>
            </div>
        </div>`;
    });

    const calc = calculateDeals(cart);
    const rows = document.getElementById('summary-rows');
    
    rows.innerHTML = `
        ${calc.unitSaving > 0 ? `<div class="summary-row" style="color:var(--green)">Units Deal Applied — Saved £${calc.unitSaving.toFixed(2)}</div>` : ''}
        ${calc.podSaving > 0 ? `<div class="summary-row" style="color:var(--green)">Pods Deal Applied — Saved £${calc.podSaving.toFixed(2)}</div>` : ''}
        <div class="summary-row">
            <span>Subtotal</span>
            <span>£${calc.subtotal.toFixed(2)}</span>
        </div>
        <div class="summary-row ${calc.delivery === 0 ? 'free' : ''}">
            <span>Delivery</span>
            <span>${calc.delivery === 0 ? '✅ FREE' : '£' + calc.delivery.toFixed(2)}</span>
        </div>
        ${calc.neededForFree > 0 ? `<div class="need-more">Add £${calc.neededForFree} more for FREE delivery! 🚚</div>` : ''}
        <div class="summary-row total">
            <span>TOTAL</span>
            <span>£${calc.total.toFixed(2)}</span>
        </div>
    `;
}

// Stripe Payment Setup
let elements, card;

async function initStripe() {
    elements = stripe.elements();
    card = elements.create('card', { style: { base: { color: '#fff', fontFamily: 'sans-serif' } } });
    card.mount('#card-element');
}

document.getElementById('proceed-btn').addEventListener('click', () => {
    document.getElementById('proceed-btn').style.display = 'none';
    document.getElementById('payment-form').style.display = 'block';
    initStripe();
});

document.getElementById('clear-btn').addEventListener('click', clearCart);

document.getElementById('payment-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnLoading = document.getElementById('btn-loading');
    const status = document.getElementById('payment-status');
    
    btn.disabled = true;
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline';
    status.style.display = 'none';

    const cart = getCart();
    const calc = calculateDeals(cart);
    
    try {
        const { error, paymentMethod } = await stripe.createPaymentMethod({
            type: 'card',
            card: card,
            billing_details: {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                address: { line1: document.getElementById('address').value, postal_code: document.getElementById('postcode').value }
            }
        });

        if (error) throw error;

        // For live use — you'd connect a backend to create a PaymentIntent
        // This demo shows the flow — in production, use Stripe Checkout or server-side flow
        status.className = 'status success';
        status.style.display = 'block';
        status.innerHTML = `✅ Payment Ready!<br><br>Thank you! Your order will be processed shortly.<br>Confirmation sent to ${document.getElementById('email').value}`;
        
        // Clear basket
        localStorage.removeItem('vapes4all_cart');
        
    } catch (err) {
        status.className = 'status error';
        status.style.display = 'block';
        status.textContent = 'Error: ' + err.message;
    } finally {
        btn.disabled = false;
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
    }
});

renderCart();
</script>

</body>
</html>
