<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Vapes4All</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        :root {
            --bg: #0f0f1a; --card: #1a1a2e; --accent: #ff9500;
            --red: #ef4444; --green: #22c55e; --text: #fff; --muted: #9ca3af;
        }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }

        /* AGE GATE */
        .age-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .age-box {
            background: var(--card); padding: 3rem 2.5rem; border-radius: 16px; text-align: center;
            max-width: 420px; width: 90%; border-top: 4px solid var(--accent);
        }
        .age-box h2 { font-size: 1.8rem; color: var(--accent); margin-bottom: 1rem; }
        .age-box p { color: var(--muted); margin-bottom: 2rem; font-size: 1.1rem; }
        .age-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .age-btn {
            padding: 0.9rem 2rem; border-radius: 8px; font-size: 1rem; font-weight: 700;
            border: none; cursor: pointer; transition: 0.2s; min-width: 140px;
        }
        .age-btn.yes { background: var(--accent); color: #000; }
        .age-btn.yes:hover { transform: scale(1.05); }
        .age-btn.no { background: #333; color: #999; }
        .hidden { display: none !important; }

        header { background: rgba(0,0,0,0.4); padding: 1rem 5%; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
        .nav-wrap { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { font-size: 1.6rem; font-weight: 900; color: var(--accent); text-decoration: none; }
        nav { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        nav a { color: var(--text); text-decoration: none; padding: 0.5rem 0.8rem; font-weight: 500; }
        nav a:hover, nav a.active { color: var(--accent); }
        .badge {
            position: absolute; top: -8px; right: -10px;
            background: var(--red); color: white; font-size: 11px; font-weight: bold;
            min-width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .badge.hidden { display: none; }

        .page-wrap { max-width: 900px; margin: 0 auto; padding: 2rem 5%; }
        h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--accent); }
        .item-count { color: var(--muted); margin-bottom: 1rem; }
        .clear-row { text-align: right; margin-bottom: 1rem; }
        .clear-btn { background: transparent; color: var(--red); border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; }

        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
        .shop-btn { display: inline-block; margin-top: 1.5rem; background: var(--accent); color: #000; padding: 0.8rem 2rem; border-radius: 8px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; }

        .basket-item {
            background: var(--card); border-radius: 12px; padding: 1.2rem 1.5rem; margin-bottom: 0.8rem;
            display: grid; grid-template-columns: 2fr 110px 110px 90px; gap: 1rem; align-items: center;
        }
        .item-name h3 { font-size: 1rem; margin-bottom: 0.2rem; }
        .item-name p { color: var(--muted); font-size: 0.85rem; }

        .qty-box { display: flex; align-items: center; gap: 0.5rem; }
        .qty-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 28px; height: 28px; border-radius: 6px; font-size: 1rem; cursor: pointer;
        }
        .qty-val { font-weight: 700; min-width: 24px; text-align: center; }

        .item-total { font-weight: 700; text-align: right; }
        .remove-btn {
            background: var(--red); color: white; border: none; padding: 0.5rem 0.6rem;
            border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%;
        }

        .summary { background: var(--card); border-radius: 12px; padding: 1.8rem; margin: 1.5rem 0; }
        .sum-row {
            display: flex; justify-content: space-between; padding: 0.7rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sum-row.total { border-bottom: none; font-size: 1.3rem; font-weight: 900; color: var(--accent); padding-top: 0.8rem; }
        .free-del { color: var(--green); margin: 0.8rem 0; font-weight: 600; }

        .checkout-form { background: var(--card); border-radius: 12px; padding: 2rem; margin-top: 2rem; display: none; }
        .checkout-form.active { display: block; }
        .checkout-form h2 { font-size: 1.4rem; margin-bottom: 1.5rem; color: var(--accent); }
        .form-row { margin-bottom: 1.2rem; }
        .form-row label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-row input, .form-row textarea {
            width: 100%; padding: 0.9rem 1rem; border-radius: 8px; border: none;
            background: rgba(255,255,255,0.08); color: white; font-size: 1rem;
        }
        .form-row input:focus, .form-row textarea:focus { outline: 2px solid var(--accent); }
        .form-row.half { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .checkout-btn {
            width: 100%; background: var(--accent); color: #000; border: none;
            padding: 1rem; border-radius: 8px; font-size: 1.05rem; font-weight: 900;
            cursor: pointer; margin-top: 1rem; transition: 0.2s;
        }
        .checkout-btn:hover { transform: scale(1.01); }

        .back-btn {
            background: transparent; color: var(--muted); border: none;
            padding: 0.5rem 0; cursor: pointer; margin-bottom: 1rem; font-size: 0.95rem;
        }
        .back-btn:hover { color: var(--text); }

        .success-box { text-align: center; padding: 2rem; display: none; }
        .success-box.show { display: block; }
        .success-box h2 { color: var(--green); margin-bottom: 1rem; }

        footer { text-align: center; padding: 2rem; color: var(--muted); border-top: 1px solid rgba(255,255,255,0.1); margin-top: 3rem; font-size: 0.9rem; }

        @media (max-width: 700px) {
            .basket-item { grid-template-columns: 1fr; gap: 0.8rem; }
            .form-row.half { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- AGE VERIFICATION -->
<div class="age-overlay" id="ageGate">
    <div class="age-box">
        <h2>🔞 Age Verification</h2>
        <p>You must be 18 years or older to visit this website.</p>
        <div class="age-buttons">
            <button class="age-btn yes" onclick="confirmAge()">I am 18+</button>
            <button class="age-btn no" onclick="denyAge()">Under 18</button>
        </div>
    </div>
</div>

<div class="hidden" id="siteContent">
<header>
    <div class="nav-wrap">
        <a href="index.html" class="logo">Vapes4All</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="dojo-units.html">10K Units</a>
            <a href="dojo-pods.html">10K Pods</a>
            <a href="ivg.html">IVG 10K</a>
            <a href="checkout.html" class="active">Basket</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<div class="page-wrap">
    <h1>Your Basket</h1>
    <p class="item-count" id="item-count"></p>

    <div class="clear-row" id="clear-zone" style="display:none;">
        <button class="clear-btn" onclick="clearWholeBasket()">🗑️ Clear Entire Basket</button>
    </div>

    <div id="basket-list"></div>
    <div id="basket-totals" style="display:none;"></div>

    <div class="checkout-form" id="checkoutForm">
        <button class="back-btn" onclick="hideForm()">← Back to Basket</button>
        <h2>Complete Your Order</h2>
        <form id="orderForm">
            <div class="form-row half">
                <div>
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" required>
                </div>
                <div>
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>
            </div>
            <div class="form-row">
                <label for="phone">Phone *</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-row">
                <label for="address">Delivery Address *</label>
                <textarea id="address" rows="4" required></textarea>
            </div>
            <div class="form-row">
                <label for="notes">Notes (Optional)</label>
                <textarea id="notes" rows="2"></textarea>
            </div>
            <button type="submit" class="checkout-btn">Submit Order</button>
        </form>
    </div>

    <div class="success-box" id="successBox">
        <h2>✅ Order Confirmed!</h2>
        <p>Thank you — we'll be in touch shortly.</p>
        <br>
        <a href="index.html" class="shop-btn">Back to Home</a>
    </div>
</div>

<footer>
    <p>Vapes4All © 2026 | info@vapes4all.co.uk | 18+ Only</p>
</footer>
</div>

<script>
const stripe = Stripe('pk_live_51UItZoFJdqaVBhtaeXjI9HTTkFIStttRqqoJqmnzD4ZVixfspc7EdlR3Q3vTCdgVCyORwfSyKfgro9sp9PfUHZRk00WOBKSQOG');

// AGE CHECK
function confirmAge() {
    localStorage.setItem('vapes4all_verified', 'true');
    document.getElementById('ageGate').classList.add('hidden');
    document.getElementById('siteContent').classList.remove('hidden');
}
function denyAge() {
    alert('Sorry, you must be 18+');
    window.location.href = 'https://google.com';
}
window.onload = function() {
    if (localStorage.getItem('vapes4all_verified') === 'true') confirmAge();
};

let basket = JSON.parse(localStorage.getItem('vapes4all_basket') || '[]');
function saveAndRender() {
    localStorage.setItem('vapes4all_basket', JSON.stringify(basket));
    showBasket();
}
function changeQty(name, delta) {
    const item = basket.find(i => i.name === name);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) basket = basket.filter(i => i.name !== name);
    saveAndRender();
}
function removeOne(name) {
    basket = basket.filter(i => i.name !== name);
    saveAndRender();
}
function clearWholeBasket() {
    if (confirm('Clear everything?')) { basket = []; saveAndRender(); }
}

function showBasket() {
    const list = document.getElementById('basket-list');
    const totals = document.getElementById('basket-totals');
    const countText = document.getElementById('item-count');
    const clearZone = document.getElementById('clear-zone');
    const checkoutForm = document.getElementById('checkoutForm');
    const successBox = document.getElementById('successBox');

    checkoutForm.classList.remove('active');
    successBox.classList.remove('show');

    if (basket.length === 0) {
        countText.textContent = '';
        clearZone.style.display = 'none';
        list.innerHTML = `<div class="empty-state"><h2>Basket empty</h2><a href="index.html" class="shop-btn">Shop Now</a></div>`;
        totals.style.display = 'none';
        return;
    }

    const totalItems = basket.reduce((s, i) => s + i.qty, 0);
    countText.textContent = totalItems + ' item' + (totalItems>1?'s':'') + ' in basket';
    clearZone.style.display = 'block';
    totals.style.display = 'block';

    list.innerHTML = basket.map(item => `
        <div class="basket-item">
            <div class="item-name"><h3>${item.name}</h3><p>£${item.price.toFixed(2)} each</p></div>
            <div class="qty-box">
                <button class="qty-btn" onclick="changeQty('${item.name.replace(/'/g,"\\'")}',-1)">−</button>
                <span class="qty-val">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty('${item.name.replace(/'/g,"\\'")}',1)">+</button>
            </div>
            <div class="item-total">£${(item.price*item.qty).toFixed(2)}</div>
            <button class="remove-btn" onclick="removeOne('${item.name.replace(/'/g,"\\'")}')">Remove</button>
        </div>
    `).join('');

    const sub = basket.reduce((s, i) => s + i.price*i.qty, 0);
    const freeDel = sub >= 23;
    const delCost = freeDel ? 0 : 2.99;
    const total = sub + delCost;

    totals.innerHTML = `
        <div class="summary">
            <div class="sum-row"><span>Subtotal</span><span>£${sub.toFixed(2)}</span></div>
            <div class="sum-row"><span>Delivery</span><span>${freeDel?'<strong style="color:var(--green)">FREE</strong>':'£'+delCost.toFixed(2)}</span></div>
            ${!freeDel?`<div class="free-del">Add £${(23-sub).toFixed(2)} for FREE delivery</div>`:'<div class="free-del">🎉 Free delivery unlocked!</div>'}
            <div class="sum-row total"><span>Total</span><span>£${total.toFixed(2)}</span></div>
            <button class="checkout-btn" onclick="showForm()">Proceed to Checkout</button>
        </div>
    `;
}
function showForm() {
    document.getElementById('checkoutForm').classList.add('active');
    document.getElementById('basket-totals').style.display = 'none';
}
function hideForm() {
    document.getElementById('checkoutForm').classList.remove('active');
    document.getElementById('basket-totals').style.display = 'block';
}
document.getElementById('orderForm').addEventListener('submit', e => {
    e.preventDefault();
    basket = [];
    localStorage.setItem('vapes4all_basket', JSON.stringify(basket));
    document.getElementById('checkoutForm').classList.remove('active');
    document.getElementById('successBox').classList.add('show');
});
showBasket();
</script>
</body>
</html>
