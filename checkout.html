<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Vapes4All</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

:root{
--bg:#0a0a12;
--card:#161625;
--accent:#ff9500;
--green:#22c55e;
--red:#ef4444;
--text:#fff;
--muted:#9ca3af;
}

body{
background:var(--bg);
color:var(--text);
}

header{
background:rgba(0,0,0,.85);
border-bottom:1px solid rgba(255,255,255,.08);
padding:18px;
}

.logo{
color:var(--accent);
font-size:28px;
font-weight:900;
text-decoration:none;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

h1{
margin-bottom:30px;
color:var(--accent);
}

.card{
background:var(--card);
padding:25px;
border-radius:18px;
margin-bottom:25px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

.remove{
background:var(--red);
border:none;
color:white;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

.total-box{
font-size:22px;
font-weight:bold;
}

input, textarea{
width:100%;
padding:14px;
margin-top:12px;
background:#222;
border:none;
border-radius:10px;
color:white;
}

.checkout-btn{
width:100%;
padding:16px;
margin-top:20px;
background:var(--green);
border:none;
border-radius:10px;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.empty{
text-align:center;
color:var(--muted);
padding:30px;
}

.notice{
background:rgba(34,197,94,.1);
border:1px solid var(--green);
padding:15px;
border-radius:10px;
margin-bottom:20px;
color:var(--green);
}

footer{
text-align:center;
padding:30px;
color:var(--muted);
}

</style>

</head>

<body>

<header>
<a href="index.html" class="logo">Vapes4All</a>
</header>

<div class="container">

<h1>Your Basket</h1>

<div class="notice">
🚚 Free delivery on orders over £24
</div>

<div class="card">

<div id="basketItems"></div>

</div>

<div class="card">

<div class="total-box">
Subtotal: £<span id="subtotal">0.00</span>
</div>

<br>

<div class="total-box">
Delivery: £<span id="delivery">0.00</span>
</div>

<br>

<div class="total-box">
Total: £<span id="total">0.00</span>
</div>

</div>

<div class="card">

<h2>Customer Details</h2>

<input id="fullName" placeholder="Full Name">

<input id="email" placeholder="Email Address">

<input id="phone" placeholder="Phone Number">

<textarea
id="address"
rows="4"
placeholder="Delivery Address">
</textarea>

<button class="checkout-btn" onclick="checkout()">
Continue To Payment
</button>

</div>

</div>

<footer>
Vapes4All © 2025-2026
</footer>

<script>

let basket =
JSON.parse(
localStorage.getItem('vapes4all_basket')
|| '[]'
);

function renderBasket(){

const container =
document.getElementById('basketItems');

if(basket.length===0){

container.innerHTML =
'<div class="empty">Basket is empty</div>';

updateTotals();

return;

}

container.innerHTML =
basket.map((item,index)=>`

<div class="item">

<div>

<strong>${item.name}</strong>

<br>

Qty: ${item.qty}

</div>

<div>

£${(item.price*item.qty).toFixed(2)}

<button class="remove"
onclick="removeItem(${index})">

X

</button>

</div>

</div>

`).join('');

updateTotals();

}

function removeItem(index){

basket.splice(index,1);

localStorage.setItem(
'vapes4all_basket',
JSON.stringify(basket)
);

renderBasket();

}

function updateTotals(){

let subtotal=0;

basket.forEach(item=>{

subtotal += item.price*item.qty;

});

let delivery =
subtotal >= 24 ? 0 : 2.99;

document.getElementById('subtotal').innerText =
subtotal.toFixed(2);

document.getElementById('delivery').innerText =
delivery.toFixed(2);

document.getElementById('total').innerText =
(subtotal+delivery).toFixed(2);

}

function checkout(){

if(basket.length===0){

alert('Basket is empty');

return;

}

alert(
'Basket saved ✅\n\nStripe payment page coming next.'
);

}

renderBasket();

</script>

</body>
</html>
