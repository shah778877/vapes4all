<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Basket | Vapes4All</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        :root {
            --bg: #050510; --card: #1a1a30; --accent: #ff9500; --green: #4cd964; --red: #ff3b3b; --text: #fff; --subtext: #b8b8d1;
        }
        body { background: radial-gradient(circle at top, #1a1a30 0%, #050510 65%); color: var(--text); min-height: 100vh; }
        header { background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); padding:1.2rem 5%; position:sticky; top:0; z-index:100; border-bottom:1px solid rgba(255,149,0,0.18); }
        .logo { font-size:2rem; font-weight:900; background:linear-gradient(90deg, #ff9500, #ffcc00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-decoration:none; }
        nav { float:right; margin-top:0.5rem; }
        nav a { color:var(--text); margin-left:2rem; text-decoration:none; font-weight:600; transition:0.3s; }
        nav a:hover, nav a.active { color:var(--accent); }
        .container { max-width:900px; margin:0 auto; padding:3rem 5%; }
        h1 { font-size:2.5rem; margin-bottom:2rem; text-align:center; }
        .back-link { color:var(--accent); text-decoration:none; display:inline-block; margin-bottom:2rem; }
        .back-link:hover { text-decoration:underline; }
        .cart-item {
            background:var(--card); border-radius:14px; padding:1.2rem 1.5rem; margin-bottom:1rem;
            display:flex; align-items:center; justify-content:space-between;
            border:1px solid rgba(255,255,255,0.08);
        }
        .item-info h3 { font-size:1rem; margin-bottom:0.3rem; }
        .item-type { font-size:0.85rem; color:var(--subtext); text-transform:uppercase; letter-spacing:1px; }
        .item-price { font-weight:700; font-size:1.1rem; }
        .remove-btn { background:rgba(255,59,59,0.2); color:var(--red); border:none; padding:0.5rem 1rem; border-radius:8px; cursor:pointer; font-weight:bold; transition:0.3s; }
        .remove-btn:hover { background:var(--red); color:white; }
        .empty-cart { text-align:center; padding:4rem 2rem; color:var(--subtext); }
        .empty-cart h2 { margin-bottom:1rem; }
        .summary-box {
            background:var(--card); border-radius:18px; padding:2rem; margin-top:2rem;
            border:1px solid rgba(255,149,0,0.25);
        }
        .summary-row { display:flex; justify-content:space-between; padding:0.8rem 0; border-bottom:1px solid rgba(255,255,255,0.08); }
        .summary-row.total { border-bottom:none; font-size:1.5rem; font-weight:900; color:var(--accent); padding-top:1rem; }
        .deal-msg { color:var(--green); font-weight:bold; margin:0.5rem 0; }
        .delivery-msg { color:var(--accent); margin:0.5rem 0; }
        .checkout-btn {
            width:100%; background:linear-gradient(90deg, #ff9500, #ffcc00); color:#000; border:none;
            padding:1.2rem; border-radius:50px; font-size:1.1rem; font-weight:900; margin-top:1.5rem; cursor:pointer; transition:0.3s;
        }
        .checkout-btn:hover { transform:scale(1.02); }
        .clear-btn { background:transparent; color:var(--red); border:1px solid var(--red); padding:0.7rem 1.5rem; border-radius:8px; margin-top:1rem; cursor:pointer; width:100%; font-weight:bold; transition:0.3s; }
        .clear-btn:hover { background:var(--red); color:white; }
        footer { text-align:center; padding:3rem 2rem; color:var(--subtext); border-top:1px solid rgba(255,255,255,0.08); margin-top:3rem; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">Vapes4All</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="dojo-units.html">10K Units</a>
        <a href="dojo-pods.html">10K Pods</a>
        <a href="checkout.html" class="active">Basket</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="container">
    <a href="index.html" class="back-link">← Continue Shopping</a>
    <h1>🛒 Your Basket</h1>

    <div id="cart-items"></div>
    <div id="summary" style="display:none;"></div>

    <div id="empty-msg" class="empty-cart" style="display:none;">
        <h2>Your basket is empty</h2>
        <p>Add some Units or Pods to get started</p>
        <br>
        <a href="dojo-units.html" class="checkout-btn" style="display:inline-block; text-decoration:none; width:auto; padding:1rem 2rem;">BROWSE UNITS</a>
        &nbsp;
        <a href="dojo-pods.html" class="checkout-btn" style="display:inline-block; text-decoration:none; width:auto; padding:1rem 2rem; background:linear-gradient(90deg, #4cd964, #22c55e);">BROWSE PODS</a>
    </div>
</div>

<footer>
    <p style="font-weight:600;">Vapes4All — Checkout</p>
    <p>info@vapes4all.co.uk</p>
    <p style="margin-top:1rem; font-size:0.85rem; color:#666;">⚠️ 18+ only. Age verification applies. Nicotine products.</p>
</footer>

<script>
function getCart() {
    return JSON.parse(localStorage.getItem('v4a_cart') || '[]');
}

function saveCart(cart) {
    localStorage.setItem('v4a_cart', JSON.stringify(cart));
}

function removeItem(id) {
    let cart = getCart().filter(i => i.id !== id);
    saveCart(cart);
    renderCart();
}

function clearCart() {
    if(confirm('Clear entire basket?')) {
        saveCart([]);
        renderCart();
    }
}

function calculateDeals(cart) {
    let units = cart.filter(i => i.type === 'Unit');
    let pods = cart.filter(i => i.type === 'Pod');
    
    const unitFullPrice = units.length * 6.99;
    const unitDeals = Math.floor(units.length / 3);
    const unitRemainder = units.length % 3;
    const unitDealPrice = unitDeals * 12 + unitRemainder * 6.99;
    const unitSaving = unitFullPrice - unitDealPrice;

    const podFullPrice = pods.length * 4.99;
    const podDeals = Math.floor(pods.length / 7);
    const podRemainder = pods.length % 7;
    const podDealPrice = podDeals * 20 + podRemainder * 4.99;
    const podSaving = podFullPrice - podDealPrice;

    const subtotal = unitDealPrice + podDealPrice;
    const delivery = subtotal >= 25 ? 0 : 3.99;
    const total = subtotal + delivery;

    return { units, pods, unitSaving, podSaving, subtotal, delivery, total };
}

function renderCart() {
    const cart = getCart();
    const itemsDiv = document.getElementById('cart-items');
    const summaryDiv = document.getElementById('summary');
    const emptyDiv = document.getElementById('empty-msg');

    if(cart.length === 0) {
        itemsDiv.innerHTML = '';
        summaryDiv.style.display = 'none';
        emptyDiv.style.display = 'block';
        return;
    }

    emptyDiv.style.display = 'none';
    summaryDiv.style.display = 'block';

    itemsDiv.innerHTML = cart.map(item => `
        <div class="cart-item">
            <div class="item-info">
                <h3>${item.name}</h3>
                <span class="item-type">${item.type === 'Unit' ? '🔥 Unit' : '💚 Pod'}</span>
            </div>
            <div class="item-price">£${item.price.toFixed(2)}</div>
            <button class="remove-btn" onclick="removeItem(${item.id})">✕ Remove</button>
        </div>
    `).join('');

    const d = calculateDeals(cart);
    summaryDiv.innerHTML = `
        <div class="summary-box">
            <h3 style="margin-bottom:1rem;">Order Summary</h3>
            ${d.unitSaving > 0 ? `<div class="deal-msg">✅ Units Deal Applied — Saved £${d.unitSaving.toFixed(2)}</div>` : ''}
            ${d.podSaving > 0 ? `<div class="deal-msg">✅ Pods Deal Applied — Saved £${d.podSaving.toFixed(2)}</div>` : ''}
            <div class="summary-row"><span>Subtotal</span><span>£${d.subtotal.toFixed(2)}</span></div>
            <div class="summary-row">
                <span>Delivery</span>
                <span>${d.delivery === 0 ? '<strong style="color:var(--green)">FREE</strong>' : '£'+d.delivery.toFixed(2)}</span>
            </div>
            ${d.subtotal < 25 ? `<div class="delivery-msg" style="font-size:0.9rem;">Add £${(25 - d.subtotal).toFixed(2)} more for FREE delivery!</div>` : ''}
            <div class="summary-row total"><span>TOTAL</span><span>£${d.total.toFixed(2)}</span></div>
            <button class="checkout-btn" onclick="alert('Payment gateway coming next!\\n\\nTotal: £${d.total.toFixed(2)}\\n\\nWe will add card payment system shortly.')">PROCEED TO PAYMENT →</button>
            <button class="clear-btn" onclick="clearCart()">🗑️ Clear Basket</button>
        </div>
    `;
}

renderCart();
</script>
</body>
</html>
