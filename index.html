<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapes4All</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .age-check { background: white; border-radius: 16px; padding: 40px 30px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h1 { color: #1a1a2e; margin-bottom: 15px; font-size: 28px; }
        p { color: #555; margin-bottom: 30px; font-size: 16px; line-height: 1.5; }
        .buttons { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        button { padding: 14px 35px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
        .yes { background: #2ecc71; color: white; }
        .no { background: #e74c3c; color: white; }
        nav { background: white; padding: 15px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
        nav a { margin: 0 15px; text-decoration: none; color: #1a1a2e; font-weight: bold; font-size: 18px; }
        nav a:hover { color: #e74c3c; }
        .content { display: none; color: white; text-align: center; padding: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="age-check" id="ageGate">
        <h1>🔞 Age Verification</h1>
        <p>You must be 18 years or older to visit this website.<br>Are you over 18?</p>
        <div class="buttons">
            <button class="yes" onclick="confirmAge()">Yes, I'm 18+</button>
            <button class="no" onclick="leaveSite()">No</button>
        </div>
    </div>

    <div class="content hidden" id="mainContent">
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </nav>
        <h1 style="font-size: 48px; margin-bottom: 20px;">Welcome to Vapes4All</h1>
        <p style="font-size: 20px; max-width: 600px; margin: 0 auto;">Your trusted local supplier — quality products, great prices, fast service.</p>
    </div>

    <script>
        function confirmAge() {
            document.getElementById('ageGate').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
        }
        function leaveSite() {
            window.location.href = 'https://www.google.com';
        }
    </script>
</body>
</html>
