<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vapes4All</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0a0a12;
color:white;
}

header{
background:#111;
padding:20px;
text-align:center;
}

.logo{
font-size:32px;
font-weight:bold;
color:#ff9500;
}

.hero{
padding:80px 20px;
text-align:center;
}

.hero h1{
font-size:48px;
margin-bottom:20px;
color:#ff9500;
}

.hero p{
font-size:20px;
color:#bbb;
margin-bottom:30px;
}

.buttons{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.btn{
background:#ff9500;
color:black;
padding:15px 25px;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

.products{
max-width:1100px;
margin:auto;
padding:40px 20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1a1a2e;
padding:25px;
border-radius:15px;
text-align:center;
}

.card h2{
margin-bottom:15px;
}

.price{
font-size:28px;
font-weight:bold;
color:#ff9500;
margin-bottom:10px;
}

footer{
text-align:center;
padding:30px;
margin-top:40px;
border-top:1px solid #222;
color:#aaa;
}

</style>
</head>

<body>

<header>
<div class="logo">Vapes4All</div>
</header>

<section class="hero">

<h1>Premium Vapes UK</h1>

<p>
DPD Tracked Delivery • 18+ Only • Premium Flavours
</p>

<div class="buttons">
<a href="dojo-units.html" class="btn">Dojo Units</a>
<a href="dojo-pods.html" class="btn">Dojo Pods</a>
<a href="ivg.html" class="btn">IVG 10K</a>
<a href="checkout.html" class="btn">Basket</a>
</div>

</section>

<section class="products">

<div class="card">
<h2>Dojo 10K Units</h2>
<div class="price">£6.99</div>
<p>Any 3 for £12</p>
</div>

<div class="card">
<h2>Dojo Pods</h2>
<div class="price">£4.99</div>
<p>Any 7 for £20</p>
</div>

<div class="card">
<h2>IVG 10K</h2>
<div class="price">£4.99</div>
<p>Half Price Sale</p>
</div>

</section>

<footer>

<p>Vapes4All © 2025-2026</p>

</footer>

</body>
</html>
