<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAPE STORE</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#f8f9fb;
color:#222;
}
/* Basket Icon */
.basket-icon{
position:fixed;
top:20px;
right:25px;
background:#000;
color:#fff;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
cursor:pointer;
z-index:999;
}
.basket-count{
position:absolute;
top:-5px;
right:-5px;
background:#ff4d00;
color:#fff;
font-size:12px;
font-weight:bold;
width:24px;
height:24px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}
/* Header */
header{
background:white;
box-shadow:0 2px 10px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:100;
padding:15px 20px;
}
.nav-wrap{
max-width:1200px;
margin:0 auto;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
}
.site-title{
font-size:24px;
font-weight:bold;
color:#222;
text-decoration:none;
}
.nav-links a{
color:#333;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}
.nav-links a:hover, .nav-links a.active{
color:#ff9500;
}
/* Main */
.container{
max-width:1200px;
margin:0 auto;
padding:40px 20px;
}
.page-heading{
font-size:32px;
margin-bottom:40px;
}
.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
}
.product-card{
background:white;
border-radius:16px;
padding:25px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,.06);
transition:.3s;
text-decoration:none;
color:inherit;
display:block;
}
.product-card:hover{
transform:translateY(-5px);
}
.product-img{
width:100%;
height:180px;
object-fit:contain;
border-radius:12px;
margin-bottom:20px;
background:#fff;
}
.product-name{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
color:#222;
}
.product-price{
font-size:18px;
color:#ff9500;
margin-bottom:5px;
font-weight:bold;
}
.product-deal{
font-size:14px;
color:#22c55e;
margin-bottom:20px;
}
.view-btn{
display:inline-block;
width:100%;
padding:12px;
background:#222;
color:white;
border-radius:10px;
font-weight:bold;
text-decoration:none;
transition:.2s;
}
.view-btn:hover{
background:#ff9500;
}
footer{
text-align:center;
padding:30px;
color:#666;
border-top:1px solid #eee;
margin-top:40px;
}
@media(max-width:768px){
.product-grid{grid-template-columns:1fr;}
.basket-icon{bottom:25px; right:25px; top:auto;}
.nav-links a{margin-left:12px;}
}
</style>
</head>
<body>

<div class="basket-icon" id="basketIcon" onclick="window.location.href='checkout.html'">
🛒
<span class="basket-count" id="basketCount">0</span>
</div>

<header>
<div class="nav-wrap">
<a href="index.html" class="site-title">VAPE STORE</a>
<div class="nav-links">
<a href="index.html" class="active" style="color:#ff9500">Home</a>
<a href="dojo-units.html">Units</a>
<a href="dojo-pods.html">Pods</a>
<a href="ivg.html">IVG</a>
<a href="contact.html">Contact</a>
</div>
</div>
</header>

<div class="container">
<h1 class="page-heading">VAPE STORE</h1>

<div class="product-grid">

<!-- DOJO UNITS - YOUR IMAGE + CLICK TO FLAVOURS -->
<a href="dojo-units.html" class="product-card">
<img src="dojo-units-image.jpg" alt="Dojo Blast 10K Units" class="product-img">
<h2 class="product-name">Dojo Blast 10K Units</h2>
<p class="product-price">£6.99 each</p>
<p class="product-deal">Any 3 for £12.99</p>
<div class="view-btn">View All Flavours →</div>
</a>

<!-- DOJO PODS - YOUR IMAGE + CLICK TO FLAVOURS -->
<a href="dojo-pods.html" class="product-card">
<img src="dojo-pods-image.jpg" alt="Dojo Blast Pods" class="product-img">
<h2 class="product-name">Dojo Blast Pods</h2>
<p class="product-price">£4.99 each</p>
<p class="product-deal">Any 6 for £20</p>
<div class="view-btn">View All Flavours →</div>
</a>

<!-- IVG - YOUR IMAGE + CLICK TO FLAVOURS -->
<a href="ivg.html" class="product-card">
<img src="ivg-image.jpg" alt="IVG Smart Max" class="product-img">
<h2 class="product-name">IVG Smart Max</h2>
<p class="product-price">£4.99 each</p>
<p class="product-deal">Premium Rechargeable Kit</p>
<div class="view-btn">View All Flavours →</div>
</a>

</div>
</div>

<footer>
<p>Vapes4All © 2026 | 18+ Only</p>
</footer>

<script>
let basket = JSON.parse(localStorage.getItem('vapes4all_basket') || '[]');
function updateBasketCount(){
const total = basket.reduce((sum,item)=>sum+item.qty,0);
document.getElementById('basketCount').textContent = total;
}
updateBasketCount();
</script>

</body>
</html>
