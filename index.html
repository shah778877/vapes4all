<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAPE STORE</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#f8f9fb;
color:#222;
padding:20px;
}
/* Basket Icon */
.basket-icon{
position:fixed;
top:20px;
right:25px;
background:#000;
color:#fff;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
cursor:pointer;
z-index:999;
}
.basket-count{
position:absolute;
top:-5px;
right:-5px;
background:#ff4d00;
color:#fff;
font-size:12px;
font-weight:bold;
width:24px;
height:24px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}
/* Header & Nav */
.top-nav{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
padding-bottom:15px;
border-bottom:1px solid #eee;
}
.site-title{
font-size:22px;
font-weight:bold;
color:#222;
}
.nav-links a{
color:#333;
text-decoration:none;
margin-left:15px;
font-weight:bold;
}
.nav-links a:hover, .nav-links a.active{
color:#ff4d00;
}
h1{
font-size:28px;
margin-bottom:40px;
}
/* Product Grid — YOUR LAYOUT EXACTLY */
.product-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;
max-width:1000px;
}
.product-card{
background:white;
border-radius:12px;
padding:20px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.05);
text-decoration:none;
color:inherit;
display:block;
}
.product-img{
width:100%;
height:160px;
object-fit:contain;
margin-bottom:15px;
}
.product-name{
font-size:16px;
font-weight:bold;
margin-bottom:8px;
}
.product-price{
font-size:15px;
color:#ff4d00;
margin-bottom:5px;
font-weight:bold;
}
.product-deal{
font-size:13px;
color:#22c55e;
margin-bottom:15px;
}
.view-btn{
width:100%;
padding:10px;
background:#222;
color:white;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
font-size:14px;
}
.view-btn:hover{
background:#ff4d00;
}
footer{
text-align:center;
margin-top:50px;
color:#888;
font-size:13px;
}
/* Mobile */
@media(max-width:768px){
.product-grid{grid-template-columns:1fr;}
.basket-icon{bottom:25px; right:25px; top:auto;}
}
</style>
</head>
<body>

<!-- Basket Icon -->
<div class="basket-icon" id="basketIcon" onclick="window.location.href='checkout.html'">
🛒
<span class="basket-count" id="basketCount">0</span>
</div>

<!-- Top Nav -->
<div class="top-nav">
<div class="site-title">VAPE STORE</div>
<div class="nav-links">
<a href="index.html" class="active">Home</a>
<a href="dojo-units.html">Units</a>
<a href="dojo-pods.html">Pods</a>
<a href="ivg.html">IVG</a>
<a href="contact.html">Contact</a>
</div>
</div>

<!-- Main -->
<h1>VAPE STORE</h1>

<div class="product-grid">

<!-- DOJO UNITS — YOUR IMAGE + BUTTON LINKS TO PAGE -->
<a href="dojo-units.html" class="product-card">
<img src="dojo-units.jpg" alt="Dojo Blast 10K Units" class="product-img">
<h3 class="product-name">Dojo Blast 10K Units</h3>
<p class="product-price">£6.99 each</p>
<p class="product-deal">Any 3 for £12.99</p>
<button class="view-btn">View All Flavours →</button>
</a>

<!-- DOJO PODS — YOUR IMAGE + BUTTON LINKS TO PAGE -->
<a href="dojo-pods.html" class="product-card">
<img src="dojo-pods.jpg" alt="Dojo Blast Pods" class="product-img">
<h3 class="product-name">Dojo Blast Pods</h3>
<p class="product-price">£4.99 each</p>
<p class="product-deal">Any 6 for £20</p>
<button class="view-btn">View All Flavours →</button>
</a>

<!-- IVG — YOUR IMAGE + BUTTON LINKS TO PAGE -->
<a href="ivg.html" class="product-card">
<img src="ivg.jpg" alt="IVG Smart Max" class="product-img">
<h3 class="product-name">IVG Smart Max</h3>
<p class="product-price">£4.99 each</p>
<p class="product-deal">Premium Rechargeable Kit</p>
<button class="view-btn">View All Flavours →</button>
</a>

</div>

<footer>
Vapes4All © 2026 | 18+ Only
</footer>

<script>
let basket = JSON.parse(localStorage.getItem('vapes4all_basket') || '[]');
function updateBasketCount(){
const total = basket.reduce((sum,item)=>sum+item.qty,0);
document.getElementById('basketCount').textContent = total;
}
updateBasketCount();
</script>

</body>
</html>
