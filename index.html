<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapes4All</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
        :root {
            --bg:#0f0f1a; --card:#1a1a2e; --accent:#ff9500;
            --red:#ef4444; --green:#22c55e; --text:#fff; --muted:#9ca3af;
        }
        body { background:var(--bg); color:var(--text); line-height:1.6; }
        header { background:rgba(0,0,0,0.4); padding:1rem 5%; border-bottom:1px solid rgba(255,255,255,0.1); position:sticky; top:0; z-index:100; }
        .nav-wrap { max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
        .logo { font-size:1.6rem; font-weight:900; color:var(--accent); text-decoration:none; }
        nav { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
        nav a { color:var(--text); text-decoration:none; padding:0.5rem 0.8rem; font-weight:500; position:relative; }
        nav a:hover, nav a.active { color:var(--accent); }
        .basket-link { position:relative; }
        .badge {
            position:absolute; top:-8px; right:-10px;
            background:var(--red); color:#fff; font-size:11px; font-weight:bold;
            min-width:18px; height:18px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
        }
        .badge.hidden { display:none; }

        .banner { background:linear-gradient(90deg, #ff9500, #ffb347); color:#000; text-align:center; padding:1rem; font-weight:700; }
        .hero { text-align:center; padding:3rem 5%; max-width:800px; margin:0 auto; }
        .hero h1 { font-size:2.5rem; color:var(--accent); margin-bottom:1rem; }
        .grid { max-width:1200px; margin:0 auto; padding:3rem 5%; display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:2rem; }
        .card { background:var(--card); border-radius:16px; padding:2rem; text-align:center; text-decoration:none; color:inherit; border-top:4px solid; transition:0.3s; }
        .card:hover { transform:translateY(-5px); }
        .dojo-units { border-color:#22c55e; }
        .dojo-pods { border-color:#a855f7; }
        .ivg { border-color:#3b82f6; }
        .card h2 { font-size:1.4rem; margin-bottom:1rem; }
        .price { font-size:2rem; font-weight:900; color:var(--accent); }
        .old { color:var(--muted); text-decoration:line-through; font-size:1rem; margin-left:0.5rem; }
        .deal { margin:1rem 0; padding:0.5rem 1rem; border-radius:20px; display:inline-block; font-weight:700; }
        .dojo-units .deal { background:rgba(34,197,94,0.2); color:#22c55e; }
        .dojo-pods .deal { background:rgba(168,85,247,0.2); color:#a855f7; }
        .ivg .deal { background:rgba(59,130,246,0.2); color:#3b82f6; }
        .btn { display:inline-block; background:var(--accent); color:#fff; padding:0.8rem 2rem; border-radius:10px; font-weight:900; text-decoration:none; margin-top:1rem; }
        footer { text-align:center; padding:2rem; color:var(--muted); border-top:1px solid rgba(255,255,255,0.1); margin-top:2rem; }
    </style>
</head>
<body>
<header>
    <div class="nav-wrap">
        <a href="index.html" class="logo">Vapes4All</a>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="dojo-units.html">10K Units</a>
            <a href="dojo-pods.html">10K Pods</a>
            <a href="ivg.html">IVG 10K</a>
            <a href="checkout.html" class="basket-link">
                Basket
                <span class="badge hidden" id="nav-badge">0</span>
            </a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<div class="banner">🚚 FREE Delivery on orders £23 and over</div>

<section class="hero">
    <h1>Welcome to Vapes4All</h1>
    <p>Best prices — Dojo, IVG & more</p>
</section>

<section class="grid">
    <a href="dojo-units.html" class="card dojo-units">
        <h2>Dojo Blast 10K Kits</h2>
        <div class="price">£6.99</div>
        <div class="deal">Any 3 for £12</div>
